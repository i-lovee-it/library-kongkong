<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#3b2c22" />
  <title>출석 콩콩 관리자</title>
  <link rel="stylesheet" href="./admin.css" />
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="eyebrow">OO도서관</p>
        <h1>출석 콩콩 관리자</h1>
      </div>
      <a class="home-link" href="./index.html">출석 화면</a>
    </header>

    <section class="panel login-panel" id="adminLoginSection">
      <h2>관리자 로그인</h2>
      <form id="adminLoginForm">
        <label for="adminPassword">비밀번호</label>
        <input id="adminPassword" type="password" inputmode="numeric" maxlength="12" required />
        <button type="submit">로그인</button>
      </form>
      <p class="hint">초기 비밀번호: 0509</p>
    </section>

    <section class="hidden" id="dashboardSection">
      <div class="toolbar panel">
        <input id="searchInput" type="search" placeholder="이름 또는 생일 검색" />
        <button id="refreshButton" type="button">새로고침</button>
        <button id="exportButton" type="button">CSV 저장</button>
        <button id="logoutButton" type="button" class="muted-button">로그아웃</button>
      </div>

      <section class="stats-grid">
        <article class="stat-card">
          <span>참여자</span>
          <strong id="totalParticipants">0명</strong>
        </article>
        <article class="stat-card">
          <span>오늘 출석</span>
          <strong id="todayCheckins">0명</strong>
        </article>
        <article class="stat-card">
          <span>5회 달성</span>
          <strong id="reward5Count">0명</strong>
        </article>
        <article class="stat-card">
          <span>15회 달성</span>
          <strong id="reward15Count">0명</strong>
        </article>
      </section>

      <section class="panel">
        <div class="table-title">
          <h2>참여자 목록</h2>
          <span id="visibleCount">0명 표시</span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>이름</th>
                <th>생일</th>
                <th>출석</th>
                <th>최근 출석</th>
                <th>5회 선물</th>
                <th>15회 선물</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="participantTableBody"></tbody>
          </table>
        </div>
      </section>
    </section>

    <div class="toast hidden" id="adminToast"></div>
  </main>

  <script type="module" src="./admin.js"></script>
</body>
</html>
