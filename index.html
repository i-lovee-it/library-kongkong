<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6f925e">
<title>도서관 출석 콩콩</title>
<style>
:root{--green:#6f925e;--green-dark:#557546;--cream:#f6f1df;--brown:#725239;--line:#e9e2cf;--text:#3f493a;--soft:#fbf8ef}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:"Pretendard","Noto Sans KR","맑은 고딕",sans-serif;background:radial-gradient(circle at top,#fffdf6 0,#f5f0de 45%,#ece5cf 100%);color:var(--text);display:flex;justify-content:center;align-items:flex-start;padding:18px 12px 32px}
.app{width:min(100%,470px)}
.card{position:relative;overflow:hidden;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.8);border-radius:28px;padding:24px 20px;box-shadow:0 18px 45px rgba(82,70,43,.14)}
.card:before,.card:after{content:"";position:absolute;border-radius:50%;background:#eef4e7;z-index:0}.card:before{width:150px;height:150px;right:-70px;top:-65px}.card:after{width:95px;height:95px;left:-55px;bottom:70px}.content{position:relative;z-index:1}
.mascot{width:102px;height:102px;margin:0 auto 8px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#f7e0ae,#efd49a);font-size:66px;box-shadow:0 8px 20px rgba(118,82,37,.15);cursor:pointer;user-select:none;transition:transform .15s}.mascot:active{transform:scale(.94)}
h1{margin:8px 0 4px;color:var(--green-dark);font-size:30px;letter-spacing:-1.4px}.subtitle{margin:0 0 20px;line-height:1.7;font-size:15px;color:#68715f}
.field{margin-bottom:12px;text-align:left}.field label{display:block;margin:0 0 6px 4px;font-size:13px;font-weight:800;color:#5f6759}.field input{width:100%;height:52px;padding:0 15px;border:1px solid #ddd6c4;border-radius:15px;background:#fffdfa;font-size:17px;outline:none;transition:.2s}.field input:focus{border-color:#8eae7c;box-shadow:0 0 0 4px rgba(111,146,94,.12)}
.privacy{margin:16px 0 10px;padding:13px 14px;border-radius:14px;background:#f7f6f1;border:1px solid #ebe7da;text-align:left;font-size:12px;color:#6d7069;line-height:1.6}.privacy b{color:#50564c}.agree{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 16px;font-size:14px}.agree input{width:20px;height:20px;accent-color:var(--green)}
.actions{display:grid;gap:10px}.btn{width:100%;min-height:54px;border:0;border-radius:16px;font-size:17px;font-weight:900;cursor:pointer;transition:transform .12s,filter .12s;box-shadow:0 8px 16px rgba(83,117,70,.16)}.btn:active{transform:translateY(2px)}.btn.primary{background:linear-gradient(180deg,#86aa73,#6f925e);color:white}.btn.secondary{background:#fffaf0;color:#6d5a40;border:1px solid #eadfc9;box-shadow:none}.btn.small{min-height:42px;font-size:14px;border-radius:12px}.btn.danger{background:#fff0ed;color:#a94c3d;border:1px solid #f0cbc4;box-shadow:none}
#result{margin-top:18px}.result-card{padding:18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#fffdf8,#fbf8ef);line-height:1.65}.result-title{font-size:22px;font-weight:900;color:var(--green-dark);margin-bottom:6px}.tree{font-size:72px;line-height:1.1;margin:4px 0 8px}.tree-label{font-weight:800;color:#5d684f}.count{margin-top:10px;font-size:18px;font-weight:900;color:var(--brown)}.progress{height:18px;background:#e4e1d7;border-radius:999px;overflow:hidden;margin:12px 0 6px;border:1px solid #dcd7ca}.progress>div{height:100%;background:linear-gradient(90deg,#9fc886,#6f925e);border-radius:inherit;transition:width .6s ease}.milestones{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.milestone{padding:9px 4px;border-radius:12px;background:#eeeae0;color:#8a887f;font-size:12px;font-weight:800}.milestone.on{background:#e6f2df;color:#557546;border:1px solid #c9dfbd}.acorns{font-size:23px;letter-spacing:2px;word-break:break-all;margin-top:12px}.hint{font-size:12px;color:#8b8f87;margin-top:8px}
.overlay{position:fixed;inset:0;background:rgba(40,45,35,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.overlay.show{display:flex}.modal{width:min(100%,420px);background:white;border-radius:24px;padding:24px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.22)}.modal-icon{font-size:72px}.modal h2{margin:8px 0;color:var(--green-dark)}.modal p{line-height:1.7}.modal .btn{margin-top:12px}
.acorn-rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}.falling{position:absolute;top:-60px;font-size:34px;animation:fall 1.15s ease-in forwards}@keyframes fall{to{transform:translateY(115vh) rotate(320deg);opacity:.15}}@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}.pop{animation:pop .45s ease}
.admin{margin-top:4px;text-align:left}.admin h3{text-align:center;color:var(--green-dark);font-size:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{padding:12px 6px;background:#f4f7ef;border-radius:14px;text-align:center}.stat strong{display:block;font-size:20px;color:var(--green-dark)}.search{width:100%;height:44px;border:1px solid #ddd6c4;border-radius:12px;padding:0 12px;margin-bottom:10px}.table-wrap{overflow:auto;max-height:390px;border:1px solid #ece6d8;border-radius:14px}table{width:100%;border-collapse:collapse;min-width:520px;background:white}th,td{padding:10px 8px;border-bottom:1px solid #eee9df;font-size:13px;text-align:center}th{position:sticky;top:0;background:#eef4e9;color:#536548}tr.reward{background:#fff8dc}.admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.loading{padding:20px;color:#6e7668;font-weight:800}.error{padding:15px;border-radius:14px;background:#fff1ee;color:#a54d3f;line-height:1.6}
@media (max-width:380px){.card{padding:21px 15px}h1{font-size:27px}.mascot{width:90px;height:90px;font-size:58px}.privacy{font-size:11px}}
</style>
</head>
<body>
<main class="app">
  <section class="card">
    <div class="content">
      <div class="mascot" id="mascot" onclick="secretClick()" aria-label="관리자 숨은 버튼">🐿️</div>
      <h1>도서관 출석 콩콩</h1>
      <p class="subtitle">안녕! 나는 책다람쥐 콩이야 🌰<br>도서관에 올 때마다 도토리를 모아 책숲을 완성해 보자!</p>

      <div class="field"><label for="name">이름</label><input id="name" type="text" maxlength="20" autocomplete="off" placeholder="이름을 입력해 주세요"></div>
      <div class="field"><label for="birth">생일 월일 4자리</label><input id="birth" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="예: 0101"></div>

      <div class="privacy"><b>[필수] 개인정보 수집·이용 동의</b><br>○ 수집항목: 이름, 생일(월일 4자리)<br>○ 이용목적: 「도서관 출석 콩콩」 참여자 확인 및 출석 관리<br>○ 보유기간: 행사 종료 후 즉시 파기<br>※ 동의를 거부할 수 있으나 프로그램 참여가 제한될 수 있습니다.</div>
      <label class="agree"><input type="checkbox" id="agree"> 개인정보 수집·이용에 동의합니다.</label>

      <div class="actions">
        <button class="btn primary" id="checkBtn" onclick="checkIn()">🌰 콩! 출석하기</button>
        <button class="btn secondary" id="viewBtn" onclick="showMyAcorns()">🌳 내가 모은 도토리 보기</button>
      </div>
      <div id="result" aria-live="polite"></div>
    </div>
  </section>
</main>

<div class="overlay" id="rewardModal">
  <div class="modal pop">
    <div class="modal-icon">🎁</div>
    <h2 id="rewardTitle">출석 달성!</h2>
    <p id="rewardText"></p>
    <button class="btn primary" onclick="closeReward()">확인했어요</button>
  </div>
</div>
<div class="acorn-rain" id="acornRain"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDRpc1AK0Gaf4gynxyXTIn6ZE0utXLD6rg",authDomain:"library-kongkong.firebaseapp.com",projectId:"library-kongkong",storageBucket:"library-kongkong.firebasestorage.app",messagingSenderId:"443047968802",appId:"1:443047968802:web:326c237815b93f914c0a7b"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
const $=id=>document.getElementById(id);
let secretCount=0; let adminRows=[];

function cleanBirth(v){return v.replace(/\D/g,"").slice(0,4)}
$("birth").addEventListener("input",e=>e.target.value=cleanBirth(e.target.value));
function localDateKey(){const d=new Date(); const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,"0"); const day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`}
function escapeHtml(v=""){return String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
function getInputs(requireAgree=false){const name=$("name").value.trim(); const birth=cleanBirth($("birth").value); if(!name){alert("이름을 입력해 주세요!");$("name").focus();return null} if(!/^\d{4}$/.test(birth)){alert("생일을 월일 4자리로 입력해 주세요. 예: 0101");$("birth").focus();return null} if(requireAgree&&!$("agree").checked){alert("개인정보 수집·이용에 동의해 주세요.");return null} return{name,birth,userId:`${name}_${birth}`}}
function treeInfo(n){if(n>=30)return{icon:"🏆🌳🐿️",label:"책숲 완성!"};if(n>=20)return{icon:"🌳🐿️",label:"콩이가 찾아왔어요!"};if(n>=15)return{icon:"🌳",label:"튼튼한 나무가 되었어요"};if(n>=10)return{icon:"🌿",label:"나무가 무럭무럭 자라고 있어요"};if(n>=5)return{icon:"🌱",label:"새싹이 돋았어요"};return{icon:"🌰",label:"도토리를 모으는 중이에요"}}
function resultHtml(name,n,message){const t=treeInfo(n),p=Math.min(n/30*100,100);return `<div class="result-card pop"><div class="result-title">${message}</div><div class="tree">${t.icon}</div><div class="tree-label">${t.label}</div><div class="count">${escapeHtml(name)} 친구의 도토리 ${n}개</div><div class="progress"><div style="width:${p}%"></div></div><b>${n} / 30일</b><div class="milestones"><div class="milestone ${n>=5?'on':''}">🎁 5회 선물</div><div class="milestone ${n>=15?'on':''}">🎁 15회 선물</div><div class="milestone ${n>=30?'on':''}">🏆 30회 완주</div></div><div class="acorns">${"🌰".repeat(Math.min(n,18))}</div>${n>18?`<div class="hint">도토리가 너무 많아 일부만 보여요!</div>`:""}</div>`}
function setBusy(b){$("checkBtn").disabled=b;$("viewBtn").disabled=b;$("checkBtn").textContent=b?"처리 중...":"🌰 콩! 출석하기"}
function rain(){const box=$("acornRain");box.innerHTML="";for(let i=0;i<16;i++){const s=document.createElement("span");s.className="falling";s.textContent="🌰";s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.45+"s";s.style.fontSize=(24+Math.random()*24)+"px";box.appendChild(s)}setTimeout(()=>box.innerHTML="",1800)}
function showReward(n){if(![5,15,30].includes(n))return;$("rewardTitle").textContent=n===30?"책숲 완성!":"선물 받을 시간!";$("rewardText").innerHTML=n===30?"30회 출석을 모두 달성했어요!<br>관리자에게 완주 선물을 확인해 주세요.":`<b>${n}회 출석</b>을 달성했어요!<br>관리자에게 화면을 보여주고 선물을 받아가세요.`;$("rewardModal").classList.add("show")}
function closeReward(){$("rewardModal").classList.remove("show")}

async function checkIn(){const u=getInputs(true);if(!u)return;setBusy(true);$("result").innerHTML='<div class="loading">콩이가 출석을 확인하고 있어요… 🐿️</div>';try{const ref=doc(db,"participants",u.userId);const snap=await getDoc(ref);let n=0,last="",reward5=false,reward15=false,reward30=false;if(snap.exists()){const d=snap.data();n=d.acorns||0;last=d.lastDate||"";reward5=!!d.reward5;reward15=!!d.reward15;reward30=!!d.reward30}const today=localDateKey();if(last===today){$("result").innerHTML=resultHtml(u.name,n,"오늘은 이미 출석했어요 😊");return}n++;await setDoc(ref,{name:u.name,birth:u.birth,acorns:n,lastDate:today,reward5,reward15,reward30,updatedAt:serverTimestamp()},{merge:true});rain();$("result").innerHTML=resultHtml(u.name,n,"🎉 출석 완료!");showReward(n)}catch(e){console.error(e);$("result").innerHTML='<div class="error">출석 정보를 불러오지 못했어요.<br>인터넷 연결과 Firebase 설정을 확인해 주세요.</div>'}finally{setBusy(false)}}

async function showMyAcorns(){const u=getInputs(false);if(!u)return;setBusy(true);$("result").innerHTML='<div class="loading">도토리를 찾고 있어요… 🌰</div>';try{const snap=await getDoc(doc(db,"participants",u.userId));if(!snap.exists()){$("result").innerHTML=resultHtml(u.name,0,"아직 모은 도토리가 없어요");return}const d=snap.data();$("result").innerHTML=resultHtml(u.name,d.acorns||0,"나의 출석 현황") }catch(e){console.error(e);$("result").innerHTML='<div class="error">정보를 불러오지 못했어요.<br>잠시 후 다시 시도해 주세요.</div>'}finally{setBusy(false)}}

function secretClick(){secretCount++;$("mascot").style.transform=`rotate(${secretCount%2?'-8':'8'}deg)`;setTimeout(()=>$("mascot").style.transform="",120);if(secretCount>=5){secretCount=0;adminLogin()}}
function adminLogin(){const pw=prompt("관리자 비밀번호를 입력하세요");if(pw===null)return;if(pw!=="0509"){alert("비밀번호가 틀렸습니다.");return}showAdminPage()}
async function showAdminPage(){setBusy(true);$("result").innerHTML='<div class="loading">참가자 목록을 불러오고 있어요…</div>';try{const snap=await getDocs(collection(db,"participants"));adminRows=[];snap.forEach(s=>adminRows.push({id:s.id,...s.data()}));adminRows.sort((a,b)=>(b.acorns||0)-(a.acorns||0));renderAdmin(adminRows)}catch(e){console.error(e);$("result").innerHTML='<div class="error">관리자 정보를 불러오지 못했어요.<br>Firestore 보안 규칙을 확인해 주세요.</div>'}finally{setBusy(false)}}
function renderAdmin(rows){const total=rows.reduce((s,r)=>s+(r.acorns||0),0),complete=rows.filter(r=>(r.acorns||0)>=30).length;const trs=rows.map(r=>{const n=r.acorns||0;const reward=n>=5&&!r.reward5||n>=15&&!r.reward15||n>=30&&!r.reward30;return `<tr class="${reward?'reward':''}"><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.birth)}</td><td><b>${n}</b></td><td>${escapeHtml(r.lastDate||'-')}</td><td><button class="btn small" onclick="markReward('${encodeURIComponent(r.id)}',${n})">선물확인</button></td><td><button class="btn small danger" onclick="removeUser('${encodeURIComponent(r.id)}','${escapeHtml(r.name)}')">삭제</button></td></tr>`}).join("");$("result").innerHTML=`<div class="result-card admin"><h3>📋 관리자 페이지</h3><div class="stats"><div class="stat"><strong>${rows.length}</strong>참가자</div><div class="stat"><strong>${total}</strong>도토리</div><div class="stat"><strong>${complete}</strong>완주자</div></div><input class="search" id="adminSearch" placeholder="이름 또는 생일 검색" oninput="filterAdmin()"><div class="table-wrap"><table><thead><tr><th>이름</th><th>생일</th><th>출석</th><th>마지막 출석</th><th>선물</th><th>삭제</th></tr></thead><tbody>${trs||'<tr><td colspan="6">참가자가 없습니다.</td></tr>'}</tbody></table></div><div class="admin-actions"><button class="btn secondary small" onclick="downloadCsv()">CSV 내려받기</button><button class="btn secondary small" onclick="closeAdmin()">참가자 화면으로</button></div><div class="hint">노란색 행은 달성 선물 확인이 필요한 참가자입니다.</div></div>`}
function filterAdmin(){const q=$("adminSearch").value.trim().toLowerCase();renderAdmin(adminRows.filter(r=>(r.name||"").toLowerCase().includes(q)||(r.birth||"").includes(q)));setTimeout(()=>{$("adminSearch").value=q;$("adminSearch").focus()},0)}
async function markReward(encoded,n){const id=decodeURIComponent(encoded);const field=n>=30?"reward30":n>=15?"reward15":n>=5?"reward5":null;if(!field){alert("아직 선물 기준을 달성하지 않았어요.");return}await setDoc(doc(db,"participants",id),{[field]:true},{merge:true});alert("선물 수령 확인을 저장했습니다.");showAdminPage()}
async function removeUser(encoded,name){if(!confirm(`${name} 참가자의 출석 기록을 삭제할까요?\n삭제 후 되돌릴 수 없습니다.`))return;await deleteDoc(doc(db,"participants",decodeURIComponent(encoded)));showAdminPage()}
function downloadCsv(){const header=["이름","생일","출석수","마지막출석","5회선물","15회선물","30회완주"];const lines=adminRows.map(r=>[r.name,r.birth,r.acorns||0,r.lastDate||"",r.reward5?"완료":"",r.reward15?"완료":"",r.reward30?"완료":""].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","));const blob=new Blob(["\ufeff"+[header.join(","),...lines].join("\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`도서관_출석콩콩_${localDateKey()}.csv`;a.click();URL.revokeObjectURL(a.href)}
function closeAdmin(){$("result").innerHTML=""}

Object.assign(window,{checkIn,showMyAcorns,secretClick,closeReward,showAdminPage,filterAdmin,markReward,removeUser,downloadCsv,closeAdmin});
</script>
</body>
</html>
