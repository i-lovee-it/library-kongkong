<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7c948" />
  <title>도서관 출석 콩콩 Ver.4.0</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="mascot" aria-hidden="true">🐿️</div>
      <p class="eyebrow">OO도서관 어린이자료실</p>
      <h1 id="page-title">도서관 출석 콩콩</h1>
      <p class="subtitle">도서관에 올 때마다 도토리를 모아 보세요!</p>
    </section>

    <section class="card login-card" id="loginSection">
      <h2>출석할 친구를 알려주세요</h2>

      <form id="checkinForm" novalidate>
        <label for="nameInput">이름</label>
        <input
          id="nameInput"
          name="name"
          type="text"
          maxlength="20"
          autocomplete="off"
          placeholder="예: 김콩이"
          required
        />

        <label for="birthInput">생일 4자리</label>
        <input
          id="birthInput"
          name="birth"
          type="text"
          inputmode="numeric"
          maxlength="4"
          pattern="[0-9]{4}"
          autocomplete="off"
          placeholder="예: 0509"
          required
        />
        <p class="field-help">태어난 월과 일을 숫자 4자리로 입력해 주세요.</p>

        <button class="primary-button" id="checkinButton" type="submit">
          출석 콩콩!
        </button>
      </form>

      <p class="privacy-note">
        이름과 생일은 출석 확인에만 사용됩니다.
      </p>
    </section>

    <section class="card result-card hidden" id="resultSection" aria-live="polite">
      <div id="resultBadge" class="result-badge">🎉</div>
      <h2 id="resultTitle">출석 완료!</h2>
      <p id="resultMessage"></p>

      <div class="member-summary">
        <strong id="memberName"></strong>
        <span id="attendanceCount"></span>
      </div>

      <div class="progress-wrap">
        <div class="progress-labels">
          <span>도토리</span>
          <strong id="progressText">0 / 30</strong>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="30">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="acorn-grid" id="acornGrid" aria-label="모은 도토리"></div>

      <div class="reward-panel">
        <div class="reward-item" id="reward5">
          <span class="reward-icon">🎁</span>
          <div>
            <strong>5회 선물</strong>
            <p>도토리 5개를 모으면 선물을 받아요.</p>
          </div>
        </div>
        <div class="reward-item" id="reward15">
          <span class="reward-icon">🏆</span>
          <div>
            <strong>15회 선물</strong>
            <p>도토리 15개를 모으면 특별 선물을 받아요.</p>
          </div>
        </div>
      </div>

      <button class="secondary-button" id="resetButton" type="button">
        다른 친구 출석하기
      </button>
    </section>

    <div class="toast hidden" id="toast" role="status"></div>
  </main>

  <footer>
    <a href="./admin.html" aria-label="관리자 페이지">관리자</a>
    <span>Ver.4.0</span>
  </footer>

  <script type="module" src="./script.js"></script>
</body>
</html>
